    <style>
        /* page layout: menu bar / floating area / status bar, no page scroll */
        html, body { height: 100%; }
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }
        nav { position: relative; z-index: 100; flex: 0 0 auto; }

        /* the finite space where the bubbles float (bigger than the screen, so they also leave it and come back) */
        #arena {
            position: relative;
            flex: 1 1 auto;
            min-height: 0;
            overflow: hidden;
            touch-action: none;
            background: url('../media/background-poster.jpg') no-repeat center center fixed; /* still fallback if the video does not play */
            background-size: cover;
        }
        .has-bg-video #arena { background: none; }

        /* ---- bubbles ---- */
        .bubble {
            position: absolute;
            left: 0; top: 0;
            margin: 0; padding: 0; border: 0;
            background: none;
            border-radius: 50%;
            color: #fff;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            will-change: transform;
        }
        .orb {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%; height: 100%;
            box-sizing: border-box;
            border-radius: 50%;
            text-align: center;
            background:
                radial-gradient(circle at 30% 24%, rgba(255,255,255,.9) 0 5%, rgba(255,255,255,.3) 6% 15%, rgba(255,255,255,0) 22%),
                radial-gradient(circle at 70% 82%, hsla(var(--h), 100%, 85%, .55) 0 8%, rgba(255,255,255,0) 30%),
                radial-gradient(circle at 50% 50%, hsla(var(--h), 90%, 60%, .18) 52%, hsla(var(--h), 95%, 62%, .5) 80%, hsla(var(--h), 100%, 78%, .85) 100%);
            box-shadow: inset 0 0 14px rgba(255,255,255,.55), 0 0 18px hsla(var(--h), 95%, 60%, .4);
            transition: transform .15s ease, filter .15s ease;
        }
        .bubble:hover .orb { transform: scale(1.1); filter: brightness(1.15); }
        .bubble:focus-visible { outline: none; }
        .bubble:focus-visible .orb { outline: 2px dashed #fff; outline-offset: 4px; }
        .t {
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 4;
            overflow: hidden;
            padding: 0 14%;
            line-height: 1.15;
            overflow-wrap: anywhere;
            text-shadow: 0 0 3px #000, 0 0 7px #000;
            pointer-events: none;
        }
        .bubble.is-open { opacity: 0; pointer-events: none; }
        .bubble.pop .orb { animation: pop .35s ease-out; }
        @keyframes pop { 0% { transform: scale(1.6); opacity: .25; } 100% { transform: scale(1); opacity: 1; } }

        /* reduced motion: no floating, just a still grid of bubbles */
        #arena.still { overflow: auto; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 16px; padding: 18px; touch-action: auto; }
        #arena.still .bubble { position: relative; transform: none; visibility: visible; will-change: auto; }

        /* ---- 90s window ---- */
        .win {
            position: fixed;
            z-index: 200;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            padding: 2px;
            background: #c0c0c0;
            color: #000;
            font: 12px Tahoma, 'MS Sans Serif', 'Segoe UI', Arial, sans-serif;
            box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #dfdfdf, inset -2px -2px #808080, inset 2px 2px #fff,
                        0 0 0 1px #000, 8px 8px 0 rgba(0,0,0,.45);
        }
        .titlebar {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 3px 3px 3px 6px;
            background: linear-gradient(90deg, #000080, #1084d0);
            color: #fff;
            font-weight: 700;
            cursor: move;
            user-select: none;
            touch-action: none;
        }
        .ttl { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        .x {
            flex: 0 0 auto;
            width: 18px; height: 16px;
            padding: 0;
            border: 0;
            background: #c0c0c0;
            color: #000;
            font: 700 13px/14px Tahoma, Arial, sans-serif;
            cursor: pointer;
            box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #fff, inset -2px -2px #808080, inset 2px 2px #dfdfdf;
        }
        .x:active { box-shadow: inset 1px 1px #0a0a0a, inset -1px -1px #fff, inset 2px 2px #808080, inset -2px -2px #dfdfdf; }
        .winbody {
            flex: 1 1 auto;
            min-height: 0;
            margin: 2px 0;
            overflow: auto;
            background: #333;
            box-shadow: inset 1px 1px #808080, inset -1px -1px #fff;
        }
        .winbody iframe { display: block; width: 350px; max-width: 100%; border: 0; }
        .winfoot { flex: 0 0 auto; padding: 2px 6px 3px; font-size: 11px; }
        .winfoot a { color: #0000ee; }

        /* ---- status bar ---- */
        #status {
            flex: 0 0 auto;
            padding: 3px 8px;
            background: #c0c0c0;
            color: #000;
            font: 12px Tahoma, 'MS Sans Serif', 'Segoe UI', Arial, sans-serif;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            box-shadow: inset 1px 1px #808080, inset -1px -1px #fff;
        }
        .nojs { padding: 20px; font-family: 'Times New Roman', serif; }

        function measure() {
            vw = arena.clientWidth || window.innerWidth;
            vh = arena.clientHeight || Math.max(200, window.innerHeight - (navEl ? navEl.offsetHeight : 0) - 24);
            aw = vw * ARENA_SCALE;
            ah = vh * ARENA_SCALE;
            ox = (aw - vw) / 2;
            oy = (ah - vh) / 2;
            base = Math.max(76, Math.min(vw, vh) * 0.14);
        }

        function sizeBubbles() {
            bodies.forEach(function (b) {
                b.r = base * b.k / 2;
                b.m = b.r * b.r;
                b.speed = (0.18 + b.sp * 0.32) * base * SPEED;
                b.el.style.width = b.el.style.height = (2 * b.r) + 'px';
                b.el.style.fontSize = Math.max(9, 2 * b.r * 0.115) + 'px';
            });

            el.type = 'button';
            el.className = 'bubble';
            el.dataset.i = index;
            el.setAttribute('aria-label', 'Open player: ' + rel[3] + (rel[4] ? ' - ' + rel[4] : ''));
            el.style.setProperty('--h', (GROUPS[rel[0]] || 200) + Math.round((Math.random() - 0.5) * 26));
            var orb = document.createElement('span'); orb.className = 'orb';
            var label = document.createElement('span'); label.className = 't'; label.textContent = rel[3];
            orb.appendChild(label); el.appendChild(orb);
            arena.appendChild(el);
            bodies.push({ el: el, rel: rel, k: 0.78 + Math.random() * 0.4, sp: Math.random(), r: 0, m: 1, x: 0, y: 0, vx: 0, vy: 0,
                          speed: 0, shown: true, open: false, win: null });
        });

        measure();
        sizeBubbles();
        updateStatus();

        /* ---------- physics ---------- */
        function clamp(b) {
            if (b.x < b.r) { b.x = b.r; if (b.vx < 0) b.vx = -b.vx; }
            else if (b.x > aw - b.r) { b.x = aw - b.r; if (b.vx > 0) b.vx = -b.vx; }
            if (b.y < b.r) { b.y = b.r; if (b.vy < 0) b.vy = -b.vy; }
            else if (b.y > ah - b.r) { b.y = ah - b.r; if (b.vy > 0) b.vy = -b.vy; }
        }

        function collide(a, b, bounce) {
            var dx = b.x - a.x, dy = b.y - a.y, min = a.r + b.r, d2 = dx * dx + dy * dy;
            if (d2 >= min * min) return;
            if (d2 === 0) { dx = Math.random() - 0.5; dy = Math.random() - 0.5; d2 = dx * dx + dy * dy; }
            var d = Math.sqrt(d2), nx = dx / d, ny = dy / d, overlap = min - d, tm = a.m + b.m;
            a.x -= nx * overlap * b.m / tm; a.y -= ny * overlap * b.m / tm;
            b.x += nx * overlap * a.m / tm; b.y += ny * overlap * a.m / tm;
            if (!bounce) return;
            var rv = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
            if (rv < 0) {
                var imp = -2 * rv / (1 / a.m + 1 / b.m);
                a.vx -= imp * nx / a.m; a.vy -= imp * ny / a.m;
                b.vx += imp * nx / b.m; b.vy += imp * ny / b.m;
            }
        }

        function step(dt) {
            var i, j, a, n = bodies.length;
            for (i = 0; i < n; i++) {
                a = bodies[i];
                if (a.open) continue;
                a.vx += (Math.random() - 0.5) * a.speed * 0.6 * dt;       // slow wandering
                a.vy += (Math.random() - 0.5) * a.speed * 0.6 * dt;
                var sp = Math.sqrt(a.vx * a.vx + a.vy * a.vy) || 1e-6;      // keep the speed near its own target
                var f = 1 + (a.speed / sp - 1) * Math.min(1, dt * 0.8);
                a.vx *= f; a.vy *= f;
                a.x += a.vx * dt; a.y += a.vy * dt;
                clamp(a);
            }
            for (i = 0; i < n; i++) {
                if (bodies[i].open) continue;
                for (j = i + 1; j < n; j++) { if (!bodies[j].open) collide(bodies[i], bodies[j], true); }
            }
            for (i = 0; i < n; i++) { if (!bodies[i].open) clamp(bodies[i]); }
        }

        function render() {
            for (var i = 0; i < bodies.length; i++) {
                var b = bodies[i];
                if (b.open) continue;
                var sx = b.x - ox - b.r, sy = b.y - oy - b.r, d = 2 * b.r;
                var inside = sx > -d - 20 && sx < vw + 20 && sy > -d - 20 && sy < vh + 20;
                if (inside) {
                    b.el.style.transform = 'translate3d(' + sx.toFixed(1) + 'px,' + sy.toFixed(1) + 'px,0)';
                    if (!b.shown) { b.el.style.visibility = ''; b.shown = true; }
                } else if (b.shown) {
                    b.el.style.visibility = 'hidden'; b.shown = false;
                }
            }
        }

        function scatter() {
            bodies.forEach(function (b) {
                b.x = b.r + Math.random() * (aw - 2 * b.r);
                b.y = b.r + Math.random() * (ah - 2 * b.r);
                var ang = Math.random() * Math.PI * 2;
                b.vx = Math.cos(ang) * b.speed; b.vy = Math.sin(ang) * b.speed;
            });
            for (var pass = 0; pass < 40; pass++) {
                for (var i = 0; i < bodies.length; i++) for (var j = i + 1; j < bodies.length; j++) collide(bodies[i], bodies[j], false);
                bodies.forEach(clamp);
            }
        }

        var last = 0;
        function frame(ts) {
            window.requestAnimationFrame(frame);
            var dt = last ? Math.min(0.05, (ts - last) / 1000) : 0.016;
            last = ts;
            step(dt);
            render();
        }

        if (reduce) {
            arena.classList.add('still');
        } else {
            scatter();
            render();
            window.requestAnimationFrame(frame);
        }

        document.addEventListener('visibilitychange', function () { last = 0; });

        /* ---------- the player window ---------- */
        function updateStatus() {
            if (openOrder.length) {
                var b = openOrder[openOrder.length - 1];
                statusEl.textContent = 'Playing: ' + b.rel[3] + (b.rel[4] ? ' - ' + b.rel[4] : '') + '  |  click the background to let the bubble go';
            } else {
                statusEl.textContent = 'Done.  |  ' + bodies.length + ' bubbles  |  click one to open its player, click the background to let it go';
            }
        }

        function placeWindow(win, index, height) {
            var rect = arena.getBoundingClientRect();
            var areaW = window.innerWidth;
            var areaH = rect.height || Math.max(200, window.innerHeight - 80);
            var w = Math.min(356, areaW - 12);
            var h = Math.min(height + 58, areaH - 8);
            var left = Math.max(0, (areaW - w) / 2 + index * 24);
            var top = Math.max(0, rect.top + (areaH - h) / 2 + index * 24);
            win.style.width = w + 'px';
            win.style.height = h + 'px';
            win.style.left = Math.min(left, areaW - w) + 'px';
            win.style.top = top + 'px';
        }

        function buildWindow(b) {
            var rel = b.rel;
            var win = document.createElement('div');
            win.className = 'win';
            win.setAttribute('role', 'dialog');
            win.setAttribute('aria-label', rel[3]);

            var bar = document.createElement('div'); bar.className = 'titlebar';
            var ttl = document.createElement('span'); ttl.className = 'ttl';
            ttl.textContent = rel[3] + (rel[4] ? ' - ' + rel[4] : '');
            var x = document.createElement('button'); x.type = 'button'; x.className = 'x'; x.textContent = '\u00d7';
            x.setAttribute('aria-label', 'Close player');
            x.addEventListener('click', function () { closeBody(b); });
            bar.appendChild(ttl); bar.appendChild(x);

            var body = document.createElement('div'); body.className = 'winbody';
            var frameEl = document.createElement('iframe');
            frameEl.title = rel[3];
            frameEl.style.height = rel[2] + 'px';
            frameEl.setAttribute('seamless', '');
            frameEl.src = EMBED + rel[1];                   // the player is only loaded now
            body.appendChild(frameEl);

            win.appendChild(bar); win.appendChild(body);
            if (rel[5]) {
                var foot = document.createElement('div'); foot.className = 'winfoot';
                var link = document.createElement('a'); link.href = rel[5]; link.target = '_blank'; link.rel = 'noopener';
                link.textContent = 'open on bandcamp \u2197';
                foot.appendChild(link); win.appendChild(foot);
            }
            makeDraggable(win, bar);
            return win;
        }

        function makeDraggable(win, handle) {
            var dx = 0, dy = 0, dragging = false;
            handle.addEventListener('pointerdown', function (e) {
                if (e.target && e.target.className === 'x') return;
                dragging = true;
                dx = e.clientX - win.offsetLeft; dy = e.clientY - win.offsetTop;
                if (handle.setPointerCapture && e.pointerId !== undefined) handle.setPointerCapture(e.pointerId);
                e.stopPropagation();
            });
            handle.addEventListener('pointermove', function (e) {
                if (!dragging) return;
                var left = Math.min(Math.max(e.clientX - dx, 0), window.innerWidth - 60);
                var top = Math.min(Math.max(e.clientY - dy, 0), window.innerHeight - 30);
                win.style.left = left + 'px'; win.style.top = top + 'px';
            });
            function stop() { dragging = false; }
            handle.addEventListener('pointerup', stop);
            handle.addEventListener('pointercancel', stop);
        }

        function openBody(b) {
            if (b.open) return;
            while (openOrder.length >= MAX_OPEN) closeBody(openOrder[0]);
            b.open = true;
            openOrder.push(b);
            b.el.classList.add('is-open');
            b.win = buildWindow(b);
            document.body.appendChild(b.win);
            placeWindow(b.win, openOrder.length - 1, b.rel[2]);
            updateStatus();
        }

        function closeBody(b) {
            if (!b.open) return;
            b.open = false;
            openOrder.splice(openOrder.indexOf(b), 1);
            if (b.win) { b.win.remove(); b.win = null; }       // removing the iframe stops the audio
            b.el.classList.remove('is-open');
            b.el.classList.add('pop');
            setTimeout(function () { b.el.classList.remove('pop'); }, 400);
            var ang = Math.random() * Math.PI * 2;               // back in the pool, in a new direction
            b.vx = Math.cos(ang) * b.speed; b.vy = Math.sin(ang) * b.speed;
            updateStatus();
        }

        function closeAll() { openOrder.slice().forEach(closeBody); }

        /* ---------- input ---------- */
        arena.addEventListener('pointerdown', function (e) {
            if (e.button) return;                                 // left button / touch / pen only
            var bubble = e.target && e.target.closest ? e.target.closest('.bubble') : null;
            if (bubble) { openBody(bodies[+bubble.dataset.i]); }
            else if (e.target === arena) { closeAll(); }
        });
        arena.addEventListener('click', function (e) {            // keyboard (Enter / Space) on a focused bubble
            if (e.detail !== 0) return;
            var bubble = e.target && e.target.closest ? e.target.closest('.bubble') : null;
            if (bubble) openBody(bodies[+bubble.dataset.i]);
        });
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeAll(); });

        var resizeTimer = 0;
        window.addEventListener('resize', function () {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(function () {
                var oldW = aw, oldH = ah;
                measure(); sizeBubbles();
                bodies.forEach(function (b) {
                    if (oldW && oldH) { b.x *= aw / oldW; b.y *= ah / oldH; }
                    clamp(b);
                    if (b.open && b.win) placeWindow(b.win, openOrder.indexOf(b), b.rel[2]);
                });
                if (!reduce) render();
            }, 120);
        });

        window.musicBubbles = { bodies: bodies, step: step, open: openBody, closeAll: closeAll };
    })();
    </script>
</body>
</html>
